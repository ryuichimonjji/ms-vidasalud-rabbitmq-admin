services:
  rabbitmq1:
    image: rabbitmq:3-management
    container_name: rabbitmq1
    hostname: rabbitmq1
    environment:
      RABBITMQ_ERLANG_COOKIE: vidasalud-secret-cookie
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - ./rabbitmq-cluster.conf:/etc/rabbitmq/conf.d/20-cluster.conf
      - rabbitmq1-data:/var/lib/rabbitmq
    networks:
      - rabbit-net

  rabbitmq2:
    image: rabbitmq:3-management
    container_name: rabbitmq2
    hostname: rabbitmq2
    environment:
      RABBITMQ_ERLANG_COOKIE: vidasalud-secret-cookie
    ports:
      - "5673:5672"
      - "15673:15672"
    volumes:
      - ./rabbitmq-cluster.conf:/etc/rabbitmq/conf.d/20-cluster.conf
      - rabbitmq2-data:/var/lib/rabbitmq
    networks:
      - rabbit-net
    depends_on:
      - rabbitmq1

networks:
  rabbit-net:

volumes:
  rabbitmq1-data:
  rabbitmq2-data: